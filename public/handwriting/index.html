<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fffaf0"><title>手書き · うさぽんメモ</title><link rel="stylesheet" href="style.css?v=20260923-draft-gallery2"><link rel="stylesheet" href="photo-edit.css?v=20260924-region-preview3"></head>
<body><main>
  <header><div class="brand"><a class="back-link" href="../" aria-label="うさぽんメモへ戻る" title="戻る"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg></a><span>手書き</span></div><div class="header-actions"><button id="draftsOpen" class="drafts-button" type="button" aria-haspopup="dialog">履歴</button><button id="save" class="save-button" aria-label="この端末に保存" title="この端末に保存">保存</button><button id="paste" class="paste-button" aria-haspopup="dialog" aria-expanded="false">貼り付ける</button><details class="more"><summary aria-label="その他の操作" title="その他">•••</summary><div class="menu"><button id="clear">まっさらにする</button><button id="png">スタンプとして保存</button><div class="under"><label><input id="penOnly" type="checkbox"> 指では描かない</label><label><input id="paper" type="checkbox" checked> 便箋を表示</label></div></div></details><div id="pasteOptions" class="paste-options" role="dialog" aria-label="貼り付け方" hidden><strong>仕上がり</strong><div class="paste-finish-options"><button type="button" data-paste-finish="white-outline" aria-pressed="true">白ふち</button><button type="button" data-paste-finish="transparent" aria-pressed="false">透明</button><button type="button" data-paste-finish="paper" aria-pressed="false">便箋ごと</button></div><label class="paste-library-toggle"><input id="saveToMyStickers" type="checkbox"> マイステッカーにも保存</label><div id="pasteLibraryDetails" class="paste-library-details" hidden><label><span>名前</span><input id="myStickerName" maxlength="48" placeholder="手書きステッカー"></label><label><span>保存先</span><select id="myStickerFolder"><option value="unfiled">未分類</option></select></label></div><button id="pasteConfirm" class="paste-confirm" type="button">ボードに貼る</button></div></div></header>
  <dialog id="draftGallery" class="draft-gallery" aria-labelledby="draftGalleryTitle"><div class="draft-gallery-heading"><h2 id="draftGalleryTitle">手書きの保存履歴</h2><button id="draftsClose" type="button" aria-label="閉じる">×</button></div><p>作品を開いて続きから編集。名前はタップして変更できます。</p><button id="newDraft" class="draft-new" type="button">＋ 新しい作品</button><div id="draftList" class="draft-list"></div></dialog>
  <section class="editor" aria-label="手書きと写真の編集">
    <div id="canvasViewport" class="canvas-viewport"><div id="canvasStage" class="canvas-stage"><div id="surface" class="surface paper"><canvas id="drawing" width="1000" height="750" aria-label="手書き描画面"></canvas><div id="elementLayer" class="element-layer" aria-label="写真と文字"></div></div></div></div>
<div class="dock">
    <div class="toolbar">
      <div class="history"><button id="undo" aria-label="1操作戻す" title="戻す"><svg class="historyIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6 4 11l5 5"/><path d="M4 11h9a6 6 0 0 1 6 6"/></svg></button><button id="redo" aria-label="1操作やり直す" title="やり直す"><svg class="historyIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6 5 5-5 5"/><path d="M20 11h-9a6 6 0 0 0-6 6"/></svg></button></div><div class="element-tools"><button id="toolShelfToggle" class="tool-shelf-toggle" type="button" aria-pressed="false" aria-label="描く道具を開く" title="描く道具"><svg class="tool-shelf-open" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 17 9-9 3 3-9 9H4v-3Z"/><path d="m12 9 2-2 3 3-2 2M18 4l2 2-3 3-2-2 3-3Z"/></svg><svg class="tool-shelf-back" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/><path d="M7 12h13"/></svg></button><div class="photo-add-wrap"><button id="photoMenuToggle" class="photo-add" type="button" aria-expanded="false" aria-haspopup="menu">写真</button><input id="photoInput" type="file" accept="image/*" multiple hidden><div id="photoMenu" class="photo-menu" role="menu" hidden><button id="photoNew" type="button" role="menuitem">＋ 追加</button><button id="photoExisting" type="button" role="menuitem">写真を編集</button></div></div><button id="textAdd" type="button">文字</button></div>
      <div class="size" aria-label="太さを選ぶ">
        <div class="stroke-presets" aria-label="基本の太さ">
          <button type="button" data-size="2" aria-label="とても細い"><svg viewBox="0 0 48 28" aria-hidden="true"><path d="M4 18c8-13 13 8 21-3s11-5 19 2"/></svg></button>
          <button type="button" data-size="5" aria-label="細い"><svg viewBox="0 0 48 28" aria-hidden="true"><path d="M4 18c8-13 13 8 21-3s11-5 19 2"/></svg></button>
          <button type="button" data-size="8" aria-label="ふつう"><svg viewBox="0 0 48 28" aria-hidden="true"><path d="M4 18c8-13 13 8 21-3s11-5 19 2"/></svg></button>
          <button type="button" data-size="14" aria-label="太い"><svg viewBox="0 0 48 28" aria-hidden="true"><path d="M4 18c8-13 13 8 21-3s11-5 19 2"/></svg></button>
          <button type="button" data-size="24" aria-label="とても太い"><svg viewBox="0 0 48 28" aria-hidden="true"><path d="M4 18c8-13 13 8 21-3s11-5 19 2"/></svg></button>
</div>
        <div class="size-adjust"><span aria-hidden="true">●</span><div class="size-range"><input id="size" aria-label="太さを微調整" type="range" min="1" max="32" value="8"></div><input id="sizeValue" class="size-number" type="number" min="1" max="32" value="8" inputmode="numeric" aria-label="太さを数値で入力"></div>
        <label class="opacity-adjust"><span>不透明度</span><input id="opacity" type="range" min="1" max="100" value="100" aria-label="不透明度"><output id="opacityValue">100%</output></label>
      </div>
      <div class="tools" aria-label="描画ツール"><button id="pen" data-drawing-tool="pen" aria-pressed="false" aria-label="ペン" title="ペン"><img src="assets/tools/pen-icon.png" alt=""></button><button id="marker" data-drawing-tool="marker" aria-pressed="false" aria-label="マーカー" title="マーカー"><img src="assets/tools/marker-icon.png" alt=""></button><button id="pencil" data-drawing-tool="pencil" aria-pressed="true" aria-label="鉛筆" title="鉛筆"><img src="assets/tools/pencil-icon.png" alt=""></button><button id="crayon" data-drawing-tool="crayon" aria-pressed="false" aria-label="クレヨン" title="クレヨン"><img src="assets/tools/crayon-icon.png" alt=""></button><button id="watercolor" data-drawing-tool="watercolor" aria-pressed="false" aria-label="水彩" title="水彩"><img src="assets/tools/watercolor-icon.png" alt=""></button><button id="eraser" data-drawing-tool="eraser" aria-pressed="false" aria-label="消しゴム" title="消しゴム"><img src="assets/tools/eraser-block-icon.png" alt=""></button></div>
    </div>
    <div class="options"><div class="palette" aria-label="色を選ぶ"><button class="color-dot is-selected" type="button" data-color="#654c46" aria-label="こげ茶" title="こげ茶"></button><button class="color-dot" type="button" data-color="#df8e9c" aria-label="ピンク" title="ピンク"></button><button class="color-dot" type="button" data-color="#8cae81" aria-label="緑" title="緑"></button><button class="color-dot" type="button" data-color="#6da9c6" aria-label="水色" title="水色"></button></div><div id="colorPicker" class="custom-color"><input id="color" type="hidden" value="#654c46"><button id="colorToggle" class="custom-color-toggle" type="button" aria-label="好きな色を作る" title="色を作る" aria-expanded="false"><span class="color-create-icon" aria-hidden="true"><i></i></span></button><div id="colorPanel" class="circular-color-panel" role="dialog" aria-label="好きな色を作る" hidden><canvas id="colorWheel" class="circular-color-wheel" width="240" height="240" role="slider" tabindex="0" aria-label="色相と鮮やかさ"></canvas><label class="circular-brightness-row"><span>明るさ <output id="colorBrightnessValue">100%</output></span><input id="colorBrightness" type="range" min="0" max="1" step="0.01" value="1"></label><label class="circular-hex-row"><span>カラーコード</span><input id="colorHex" maxlength="7" value="#654C46" inputmode="text"></label><button id="colorConfirm" class="circular-color-confirm" type="button">✓ この色に決定</button></div></div></div>
    <div class="palette-shelf" aria-label="マイパレット"><div id="paletteHolders" class="palette-holders"></div><button id="paletteAdd" class="palette-add" type="button" aria-label="パレットを追加" title="パレットを追加"><span aria-hidden="true">＋</span></button><div id="palettePanel" class="palette-panel" role="dialog" aria-label="パレット" hidden><div class="palette-panel-head"><strong id="paletteTitle"></strong><button id="paletteClose" type="button" aria-label="パレットを閉じる">×</button></div><div id="paletteColors" class="palette-colors"></div><div class="palette-panel-actions"><button id="paletteAddColor" type="button">今の色を追加</button><button id="paletteDelete" type="button">削除</button></div></div></div>
</div></section>
  <div id="photoBusy" class="photo-busy" role="status" aria-live="polite" hidden><span class="photo-busy-spinner" aria-hidden="true"></span><span id="photoBusyText">背景を削除しています…</span></div>
  <div id="elementPanel" class="element-panel" hidden><div class="element-panel-head"><strong id="elementTitle">編集</strong><button id="elementClose" type="button" aria-label="編集を完了" title="完了"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button></div><div id="photoEditControls" class="photo-edit-controls" hidden><div class="photo-corner-controls" role="group" aria-label="写真の編集操作"><button id="photoDelete" type="button" aria-label="写真を削除" title="削除"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7m4-7v7"/></svg></button><button id="photoDone" type="button" aria-label="写真の編集を完了" title="完了"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button><button id="photoUndo" type="button" aria-label="写真の操作を一つ戻す" title="一つ戻す" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6 4 11l5 5"/><path d="M4 11h9a6 6 0 0 1 6 6"/></svg></button><button id="photoRedo" type="button" aria-label="戻した写真の操作をやり直す" title="やり直す" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6 5 5-5 5"/><path d="M20 11h-9a6 6 0 0 0-6 6"/></svg></button></div><div id="photoRegionActions" class="photo-region-actions" role="group" aria-label="選んだ範囲の操作" hidden><button id="photoRegionDelete" type="button">この範囲を消す</button><button id="photoRegionCancel" type="button" aria-label="範囲の選択をやめる">×</button></div><div class="photo-actions">
  <button id="photoKeep" type="button" aria-label="写真を選択" title="写真を選択"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="m4 16 5-5 4 4 2-2 5 5M16 9h.01"/></svg><span>選択</span></button>
  <button id="photoRemove" type="button" aria-label="自動切り抜き" title="自動切り抜き"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.2 3.8L17 8l-3.8 1.2L12 13l-1.2-3.8L7 8l3.8-1.2L12 3ZM5 14l.8 2.2L8 17l-2.2.8L5 20l-.8-2.2L2 17l2.2-.8L5 14ZM17 13l1 3 3 1-3 1-1 3-1-3-3-1 3-1 1-3Z"/></svg><span>自動切り抜き</span></button>
  <button id="photoTap" type="button" aria-label="タップで消す" title="タップで消す"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v4m0 10v4M3 12h4m10 0h4"/><circle cx="12" cy="12" r="3"/></svg><span>タップで消す</span></button>
  <button id="photoEraser" type="button" aria-label="なぞって消す" title="なぞって消す" aria-controls="photoBrushSizes" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 15 9-9 6 6-7 7H8l-4-4Z"/><path d="m10 19 6-6"/></svg><span>なぞって消す</span></button>
  <button id="photoRestore" type="button" aria-label="消した部分を復元" title="消した部分を復元" aria-controls="photoBrushSizes" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 17 8-9 5 5-8 8H5v-4Z"/><path d="M18 3v6m-3-3h6"/></svg><span>復元</span></button>
  <button id="elementOriginal" type="button" aria-label="元写真に戻す" title="元写真に戻す"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6 4 11l5 5"/><path d="M4 11h9a6 6 0 0 1 6 6"/></svg><span>元写真</span></button>
</div>
<div id="photoBrushSizes" class="photo-brush-sizes" role="dialog" aria-label="ブラシの太さ" hidden>
  <strong id="photoBrushTitle">消しゴムの太さ</strong>
  <div class="photo-brush-presets" role="group" aria-label="基本の太さ">
    <button type="button" data-photo-brush="12" aria-label="細い"><i></i></button>
    <button type="button" data-photo-brush="22" aria-label="やや細い"><i></i></button>
    <button type="button" data-photo-brush="34" aria-label="ふつう"><i></i></button>
    <button type="button" data-photo-brush="52" aria-label="太い"><i></i></button>
    <button type="button" data-photo-brush="72" aria-label="とても太い"><i></i></button>
  </div>
  <label>太さを調整 <input id="photoEraserSize" type="range" min="8" max="80" value="34" aria-label="写真用ブラシの太さ"></label>
</div><p id="photoEditHint">写真は端末内で処理します。</p><div class="photo-progress-row"><progress id="photoProgress" max="1" value="0" hidden></progress><button id="photoCancel" type="button" hidden>中止</button></div><div class="element-transform"><label aria-label="写真の大きさ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5m13 5h5v-5"/></svg><small>大きさ</small><input id="elementScale" type="range" min="30" max="240" value="100"></label><label aria-label="写真の回転"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 1-2-5.3"/><path d="M20 3v6h-6"/></svg><small>角度</small><input id="elementRotation" type="range" min="-180" max="180" value="0"></label></div></div><div id="textEditControls" class="text-edit-controls"><div id="textFonts" class="text-fonts" role="group" aria-label="書体"><button type="button" data-text-font='-apple-system,"Hiragino Sans","Yu Gothic",sans-serif' style='font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif'>ゴシック</button><button type="button" data-text-font='"Hiragino Mincho ProN","Yu Mincho",serif' style='font-family:"Hiragino Mincho ProN","Yu Mincho",serif'>明朝</button><button type="button" data-text-font='"HuiFontP","Klee One","Hiragino Sans",cursive' style='font-family:"HuiFontP","Klee One","Hiragino Sans",cursive'>手書き</button><button type="button" data-text-font='"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif' style='font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif'>丸文字</button></div><div class="text-settings"><div class="text-color-control" role="group" aria-label="文字色"><button type="button" data-text-color="#654c46" aria-label="こげ茶"></button><button type="button" data-text-color="#df8e9c" aria-label="ピンク"></button><button type="button" data-text-color="#8cae81" aria-label="緑"></button><button type="button" data-text-color="#6da9c6" aria-label="水色"></button><label class="text-custom-color" aria-label="その他の文字色"><input id="textColor" type="color" value="#654c46"><span class="color-create-icon" aria-hidden="true"><i></i></span></label></div><label class="text-size-control"><span>大きさ <output id="textSizeValue">54</output></span><input id="textSize" type="range" min="16" max="160" value="54"></label><label class="text-weight-control"><span>太さ</span><select id="textWeight"><option value="400">細</option><option value="600">中</option><option value="700" selected>太</option><option value="900">極太</option></select></label><label class="text-outline-control"><span>白ふち</span><input id="textStroke" type="range" min="0" max="16" value="0"></label></div></div><input id="textValue" type="hidden"><div class="element-actions"><button id="elementDuplicate" type="button">複製</button><button id="elementBack" type="button">↓</button><button id="elementFront" type="button">↑</button><button id="elementDelete" type="button">削除</button></div></div>
  <div class="lab-debug" hidden><p id="metrics"></p><pre id="inputLog">入力中断はまだありません</pre></div>
  <p id="status" role="status" aria-live="polite"></p>
</main><link rel="stylesheet" href="background.css"><script type="module" src="app.mjs?v=20260924-region-preview2"></script><script type="module" src="background.mjs"></script></body></html>
